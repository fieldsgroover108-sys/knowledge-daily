<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识日报 · 证据台账</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><header class="brand"><span>KNOWLEDGE OS</span><nav><a href="index.html" class="active">总览</a><a href="domain.html">领域深读</a><a href="evidence.html">证据台账</a></nav></header><section class="page-head"><div><p class="eyebrow">EVIDENCE LEDGER</p><h1>每个结论，都有它的证据等级。</h1></div><p>事实、规则、推断、用户输入和未决信息必须分开。</p></section><section class="legend"><span class="fact">事实</span><span class="rule">规则</span><span class="inference">推断</span><span class="unresolved">未决</span></section><section class="ledger-grid"><article class="ledger-card fact"><small>事实 / 已验证</small><h2>流水线状态</h2><p>每日任务、候选产物、早报和健康检查均保留运行回执。</p></article><article class="ledger-card rule"><small>规则 / 系统约束</small><h2>候选优先</h2><p>REVISE、QUARANTINE 和主动情报候选不得自动升级为正式知识。</p></article><article class="ledger-card inference"><small>推断 / 待核验</small><h2>画像变化</h2><p>主题频率和来源趋势只生成画像候选，不能直接改写长期事实。</p></article><article class="ledger-card unresolved"><small>未决 / 观察中</small><h2>长期稳定性</h2><p>需要七个不同日期的连续证据，当前不能宣称无人值守稳定。</p></article></section><footer><span>每日知识档案</span><span>20260906</span></footer></main></body></html>
